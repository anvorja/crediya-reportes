# Servicio de REPORTES en local: lee los avisos de solicitudes aprobadas (SQS) y guarda el acumulado en DynamoDB. Para poder
# consultarlo con un token de ADMIN se levanta tambien AUTENTICACION (clonada al lado) con su base de datos.
#
# Uso (desde la raiz de este repositorio, con microservicio-autenticacion clonado al lado):
#   ./scripts/init-env.sh && docker compose --env-file .env -f deployment/docker-compose.yml up --build
#
# Si el repositorio de autenticacion esta en otra ruta: AUTH_REPO_PATH=/ruta/a/microservicio-autenticacion
#
# AWS en local: LocalStack emula SQS y DynamoDB. Las credenciales "test" son ficticias y solo valen contra LocalStack.
# Para ver el acumulado en la tabla:
#   docker compose --env-file .env -f deployment/docker-compose.yml run --rm --no-deps -T --entrypoint aws aws-init \
#     --endpoint-url http://localstack:4566 dynamodb scan --table-name crediya-reportes
name: crediya-reportes

services:
  db-autenticacion:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: crediya_auth
      POSTGRES_USER: ${AUTH_DB_USERNAME:?Define AUTH_DB_USERNAME (ver .env.example)}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Define AUTH_DB_PASSWORD (ver .env.example)}
    volumes:
      - db-autenticacion-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [crediya-net]
    restart: unless-stopped

  autenticacion:
    build:
      context: ${AUTH_REPO_PATH:-../../microservicio-autenticacion}
      dockerfile: deployment/Dockerfile
    image: crediya/autenticacion:local
    environment:
      DB_HOST: db-autenticacion
      DB_PORT: 5432
      DB_NAME: crediya_auth
      DB_USERNAME: ${AUTH_DB_USERNAME:?Define AUTH_DB_USERNAME (ver .env.example)}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?Define AUTH_DB_PASSWORD (ver .env.example)}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Define JWT_PRIVATE_KEY (./scripts/generate-jwt-key.sh)}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@crediya.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Define BOOTSTRAP_ADMIN_PASSWORD (ver .env.example)}
      BOOTSTRAP_ADMIN_DOCUMENTO: ${BOOTSTRAP_ADMIN_DOCUMENTO:-0000000001}
    ports:
      - "${AUTH_PORT:-8081}:8080"
    depends_on:
      db-autenticacion:
        condition: service_healthy
    networks: [crediya-net]
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 768m

  localstack:
    # Se fija 4.9.2: las versiones "latest" posteriores exigen un LOCALSTACK_AUTH_TOKEN
    image: localstack/localstack:4.9.2
    environment:
      SERVICES: sqs,dynamodb
      DEBUG: 0
    # Solo en tu maquina: para enviar mensajes de prueba desde el host
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    healthcheck:
      # Los servicios figuran "available" hasta su primer uso: basta con que el endpoint de salud responda
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [crediya-net]
    restart: unless-stopped

  aws-init:
    image: amazon/aws-cli:2.27.50
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      LOCALSTACK_URL: http://localstack:4566
    volumes:
      - ./localstack/init.sh:/init.sh:ro
    depends_on:
      localstack:
        condition: service_healthy
    networks: [crediya-net]
    restart: "no"

  reportes:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: crediya/reportes:local
    environment:
      # Comunicacion entre servicios por el nombre del servicio de compose
      AUTH_JWKS_URI: http://autenticacion:8080/.well-known/jwks.json
      # AWS (LocalStack en local). En AWS real se quitan el endpoint y las claves: la tarea usa su rol de IAM
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_TABLE: crediya-reportes
      SQS_APROBADAS_URL: http://localstack:4566/000000000000/crediya-solicitud-aprobada
    ports:
      - "${REPORTES_PORT:-8080}:8080"
    depends_on:
      autenticacion:
        condition: service_healthy
      aws-init:
        condition: service_completed_successfully
    networks: [crediya-net]
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 768m

volumes:
  db-autenticacion-data:

networks:
  crediya-net:
